[package]
name = "footman"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Cross-platform hyper-key launcher — Hyper plus a key focuses an app, opens a target, runs a command, or switches desktop"
license = "MIT"
repository = "https://github.com/EkinBarisC/footman"
keywords = ["hotkey", "launcher", "hyperkey", "keyboard", "windows"]

# The Core is a library so the integration tests exercise the real public API
# (see ADR-0002 and DESIGN.md §9). The binary arrives with the Shell in slice 3.
[lib]
name = "footman"
path = "src/lib.rs"

[[bin]]
name = "footman"
path = "src/main.rs"

# Dependencies are introduced with the slice that needs them.
[dependencies]
# Config (slice 2). `toml` is chosen over a hand-rolled parser mainly for its
# error spans: DESIGN.md §7 requires a malformed file to be reported with a
# line number rather than a shrug.
serde = { version = "1", features = ["derive"] }
toml = "0.9"
# Finds the per-user config directory each platform actually uses, so the path
# is not hard-coded per OS.
directories = "6"

[dev-dependencies]
# The Core's safety invariants ("nothing is ever suppressed unless Hyper is
# held") are universal claims, so they are stated as properties rather than as
# a handful of examples.
proptest = "1"
# Config loading touches the filesystem, so its tests need a scratch directory.
tempfile = "3"

[features]
# Opt-in: installs a real keyboard hook and synthesises real input, so it is
# never on by default. Run with `cargo test --features integration-test`.
integration-test = []

[target."cfg(windows)".dev-dependencies]
# The end-to-end test inspects Windows' own input state to check its premises.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target."cfg(windows)".dependencies]
# The Windows Shell: the low-level keyboard hook and its message loop (slice 3),
# and the window enumeration, identity cascade and activation the App Action
# needs (slice 4, ADR-0003).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Storage_Packaging_Appx",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
